name: Deploy to Azure Web App

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for Azure OIDC login

env:
  AZURE_WEBAPP_NAME: AnswerCode123
  AZURE_RESOURCE_GROUP: appservice
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "20.x"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # dotnet publish triggers the NpmInstallLspServers target (BeforePublish),
      # which runs `npm install` under lsp-servers — Node.js must be available.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore
        run: dotnet restore AnswerCode.Tests/AnswerCode.Tests.csproj

      - name: Build
        run: dotnet build AnswerCode.Tests/AnswerCode.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test AnswerCode.Tests/AnswerCode.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Publish
        run: dotnet publish AnswerCode.csproj --configuration Release --output ./publish

      - name: Stamp deployment commit
        run: printf '%s' "$GITHUB_SHA" > ./publish/wwwroot/deployment.txt

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: ./publish
          # Preserve the server-provisioned appsettings.local.json file.
          clean: false
          restart: true

      - name: Verify deployed commit
        shell: bash
        run: |
          url="https://${AZURE_WEBAPP_NAME}.azurewebsites.net/deployment.txt"

          for attempt in {1..12}; do
            deployed_sha="$(curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache, no-store' \
              "${url}?sha=${GITHUB_SHA}&attempt=${attempt}" || true)"

            if [[ "$deployed_sha" == "$GITHUB_SHA" ]]; then
              echo "Verified deployment of ${GITHUB_SHA}."
              exit 0
            fi

            echo "Attempt ${attempt}: expected ${GITHUB_SHA}, received '${deployed_sha}'."
            sleep 10
          done

          echo "::error::Azure Web App is not serving the deployed commit ${GITHUB_SHA}."
          exit 1
